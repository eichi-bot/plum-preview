<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜株式会社プラム</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="株式会社プラム">
<meta property="og:title" content="お問い合わせ｜株式会社プラム">
<meta property="og:description" content="コーヒー豆のお取引・サンプルのご依頼、インドネシア人材のご相談はこちらから。">
<meta property="og:url" content="https://plum-coffee.jp/contact.html">
<meta property="og:image" content="https://plum-coffee.jp/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<script src="js/gate.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header scrolled">
  <a href="index.html" class="logo" aria-label="株式会社プラム トップへ"><img class="logo-c" src="img/logo-h-color.png" alt="PLUM 株式会社プラム" width="168" height="38"><img class="logo-w" src="img/logo-h-white.png" alt="" width="163" height="38" aria-hidden="true"></a>
  <span class="credit">Website by And One</span>
  <button class="menu-btn" aria-expanded="false" aria-label="メニュー">MENU</button>
  <nav class="nav">
    <a href="coffee.html">コーヒー事業</a>
    <a href="jinzai.html">人材紹介</a>
    <a href="index.html#company">会社概要</a>
    <a href="en.html" class="lang" lang="en">EN</a>
  </nav>
</header>
<main>
<section style="padding-top:170px">
  <div class="narrow">
    <p class="sec-label">CONTACT</p>
    <h1 class="sec-title">お問い合わせ</h1>
    <p class="muted" style="font-size:13.5px">内容を確認のうえ、担当者よりご連絡いたします。<span class="tbd">試作のため送信されません</span></p>
    <form class="form" onsubmit="alert('試作のため送信されません');return false;">
      <div>
        <label>ご相談の種類<span class="req">必須</span></label>
        <div class="radios">
          <label><input type="radio" name="type" value="coffee" checked>コーヒーのお取引</label>
          <label><input type="radio" name="type" value="sample">サンプルのご依頼</label>
          <label><input type="radio" name="type" value="jinzai">人材のご相談</label>
          <label><input type="radio" name="type" value="other">その他</label>
        </div>
      </div>
      <div><label for="co">会社名<span class="req">必須</span></label><input id="co" required></div>
      <div><label for="nm">お名前<span class="req">必須</span></label><input id="nm" required></div>
      <div><label for="em">メールアドレス<span class="req">必須</span></label><input id="em" type="email" required></div>
      <div><label for="tl">電話番号</label><input id="tl" type="tel"></div>
      <!-- サンプルを選んだときだけ出す欄 -->
      <fieldset class="sample-fields" hidden>
        <legend>サンプルについて</legend>
        <div>
          <label>ご希望の品種</label>
          <div class="radios">
            <label><input type="checkbox" name="kind" value="arabica">アラビカ</label>
            <label><input type="checkbox" name="kind" value="robusta">ロブスタ</label>
            <label><input type="checkbox" name="kind" value="excelsa">エクセルサ</label>
            <label><input type="checkbox" name="kind" value="liberica">リベリカ</label>
            <label><input type="checkbox" name="kind" value="any">おまかせ</label>
          </div>
        </div>
        <div class="form-2col">
          <div><label for="vol">ご検討中の量（1回あたり）</label><select id="vol"><option value="">選んでください</option><option>〜100kg</option><option>100kg〜1t</option><option>1t〜（コンテナ単位）</option><option>未定</option></select></div>
          <div><label for="when">ご希望の時期</label><input id="when" placeholder="例：2027年春ごろ"></div>
        </div>
        <div><label for="addr">サンプルのお届け先</label><input id="addr" placeholder="〒・住所・ご担当者さま"></div>
      </fieldset>
      <div><label for="ms">お問い合わせ内容<span class="req">必須</span></label><textarea id="ms" required placeholder="ご質問やご要望をご記入ください"></textarea></div>
      <label class="radios" style="font-family:var(--gothic);font-size:13px"><input type="checkbox" required> <a href="privacy.html" target="_blank" style="border-bottom:1px solid">プライバシーポリシー</a>に同意する</label>
      <button type="submit">送信する</button>
    </form>
  </div>
</section>
</main>
<footer class="footer"><div class="wrap"><div class="copy" style="margin-top:0;border:0;padding:0"><span>© 2026 PLUM Co., Ltd.</span><span>plum-coffee.jp　／　Website by And One</span></div></div></footer>
<div class="proto-bar">試作 v1｜黄色の札＝確認待ち</div>
<script src="js/main.js"></script>
<script>
  var t=new URLSearchParams(location.search).get('type');
  if(t){var r=document.querySelector('input[name=type][value="'+t+'"]'); if(r) r.checked=true;}
  // 「サンプルのご依頼」を選んだときだけ、品種・量・時期・届け先の欄を出す
  var sf=document.querySelector('.sample-fields');
  function syncSample(){ var v=(document.querySelector('input[name=type]:checked')||{}).value; sf.hidden=(v!=='sample'); }
  document.querySelectorAll('input[name=type]').forEach(function(r){ r.addEventListener('change',syncSample); });
  syncSample();
</script>
</body>
</html>
